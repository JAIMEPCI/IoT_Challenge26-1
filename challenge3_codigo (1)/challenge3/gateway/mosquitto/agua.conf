# /etc/mosquitto/conf.d/agua.conf
# Broker local del sistema de monitoreo hídrico: sin acceso anónimo.
# (La persistencia ya viene activada en /etc/mosquitto/mosquitto.conf;
#  repetirla aquí hace que Mosquitto no arranque.)
listener 1883 0.0.0.0
allow_anonymous false
password_file /etc/mosquitto/passwd
acl_file /etc/mosquitto/acl
connection_messages true
