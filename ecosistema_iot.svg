<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1910 460" font-family="Segoe UI, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow-teal" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#2E86AB"/>
    </marker>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#2547A0"/>
    </marker>
    <marker id="arrow-indigo" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#4B3F72"/>
    </marker>
    <marker id="arrow-amber" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#C9702E"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1910" height="460" fill="#FFFFFF"/>

  <!-- Title -->
  <text x="955" y="42" text-anchor="middle" font-size="26" font-weight="600" fill="#17303B">Ecosistema IoT — Monitoreo hídrico Sabana Centro</text>
  <text x="955" y="66" text-anchor="middle" font-size="14" fill="#5A6B73">De cada punto de monitoreo hasta el usuario final, pasando por el gateway, el broker MQTT y la plataforma en la nube</text>

  <!-- ===================== ARROWS (drawn first, under boxes) ===================== -->
  <!-- Edge 1: Dispositivos -> Gateway (WiFi) -->
  <line x1="290" y1="265" x2="420" y2="265" stroke="#2E86AB" stroke-width="3" marker-end="url(#arrow-teal)"/>
  <text x="355" y="248" text-anchor="middle" font-size="14" font-weight="600" fill="#2E86AB">WiFi</text>

  <!-- Edge 2: Gateway -> Internet/Broker MQTT (Internet / MQTT) -->
  <line x1="680" y1="265" x2="810" y2="265" stroke="#2547A0" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <text x="745" y="248" text-anchor="middle" font-size="14" font-weight="600" fill="#2547A0">Internet / MQTT</text>

  <!-- Edge 3: Internet/Broker MQTT -> Plataforma IoT (MQTT) -->
  <line x1="1070" y1="265" x2="1200" y2="265" stroke="#4B3F72" stroke-width="3" marker-end="url(#arrow-indigo)"/>
  <text x="1135" y="248" text-anchor="middle" font-size="14" font-weight="600" fill="#4B3F72">MQTT</text>

  <!-- Edge 4: Plataforma IoT -> Usuario final (HTTP) -->
  <line x1="1460" y1="265" x2="1590" y2="265" stroke="#C9702E" stroke-width="3" marker-end="url(#arrow-amber)"/>
  <text x="1525" y="248" text-anchor="middle" font-size="14" font-weight="600" fill="#C9702E">HTTP</text>

  <!-- ===================== BLOCK 1: Dispositivos ===================== -->
  <g>
    <rect x="30" y="150" width="260" height="230" rx="14" fill="#E4F2EF" stroke="#1F6F78" stroke-width="2"/>
    <!-- icon: water drop -->
    <path d="M160,182 C172,200 182,214 182,226 a22,22 0 1,1 -44,0 c0,-12 10,-26 22,-44 Z" fill="none" stroke="#1F6F78" stroke-width="3"/>
    <text x="160" y="270" text-anchor="middle" font-size="19" font-weight="700" fill="#17303B">Dispositivos</text>
    <text x="160" y="300" text-anchor="middle" font-size="12.5" fill="#3B4A50">Nodo_Chia · Nodo_Zipaquira</text>
    <text x="160" y="318" text-anchor="middle" font-size="12.5" fill="#3B4A50">Nodo_Cajica</text>
    <text x="160" y="344" text-anchor="middle" font-size="12" fill="#5A6B73">ESP32 + sensores de nivel,</text>
    <text x="160" y="360" text-anchor="middle" font-size="12" fill="#5A6B73">temperatura, humedad y luz</text>
  </g>
  <!-- BLOCK1_END -->

  <!-- ===================== BLOCK 2: Gateway ===================== -->
  <g>
    <rect x="420" y="150" width="260" height="230" rx="14" fill="#E8F1FA" stroke="#2E86AB" stroke-width="2"/>
    <!-- icon: wifi arcs -->
    <circle cx="550" cy="228" r="4" fill="#2E86AB"/>
    <path d="M534,214 a22,22 0 0 1 32,0" fill="none" stroke="#2E86AB" stroke-width="3"/>
    <path d="M522,202 a40,40 0 0 1 56,0" fill="none" stroke="#2E86AB" stroke-width="3"/>
    <text x="550" y="270" text-anchor="middle" font-size="19" font-weight="700" fill="#17303B">Gateway</text>
    <text x="550" y="300" text-anchor="middle" font-size="12.5" fill="#3B4A50">Gateway_Sabana</text>
    <text x="550" y="326" text-anchor="middle" font-size="12" fill="#5A6B73">Router WiFi (Home Gateway)</text>
    <text x="550" y="344" text-anchor="middle" font-size="12" fill="#5A6B73">agrupa los 3 nodos locales</text>
  </g>

  <!-- ===================== BLOCK 3: Internet / Broker MQTT ===================== -->
  <g>
    <rect x="810" y="150" width="260" height="230" rx="14" fill="#E6ECFA" stroke="#2547A0" stroke-width="2"/>
    <!-- icon: cloud -->
    <path d="M910,232 a16,16 0 0 1 0,-32 a20,20 0 0 1 38,-8 a18,18 0 0 1 4,36 Z" fill="none" stroke="#2547A0" stroke-width="3"/>
    <circle cx="920" cy="226" r="2.5" fill="#2547A0"/>
    <circle cx="935" cy="226" r="2.5" fill="#2547A0"/>
    <circle cx="928" cy="234" r="2.5" fill="#2547A0"/>
    <text x="940" y="270" text-anchor="middle" font-size="18" font-weight="700" fill="#17303B">Internet / Broker MQTT</text>
    <text x="940" y="300" text-anchor="middle" font-size="12.5" fill="#3B4A50">Broker MQTT en la nube</text>
    <text x="940" y="326" text-anchor="middle" font-size="12" fill="#5A6B73">Recibe y redistribuye los</text>
    <text x="940" y="344" text-anchor="middle" font-size="12" fill="#5A6B73">mensajes (modelo pub/sub)</text>
  </g>

  <!-- ===================== BLOCK 4: Plataforma IoT ===================== -->
  <g>
    <rect x="1200" y="150" width="260" height="230" rx="14" fill="#ECE9F7" stroke="#4B3F72" stroke-width="2"/>
    <!-- icon: server rack -->
    <rect x="1312" y="196" width="36" height="14" rx="3" fill="none" stroke="#4B3F72" stroke-width="2.5"/>
    <rect x="1312" y="214" width="36" height="14" rx="3" fill="none" stroke="#4B3F72" stroke-width="2.5"/>
    <rect x="1312" y="232" width="36" height="14" rx="3" fill="none" stroke="#4B3F72" stroke-width="2.5"/>
    <circle cx="1319" cy="203" r="1.8" fill="#4B3F72"/>
    <circle cx="1319" cy="221" r="1.8" fill="#4B3F72"/>
    <circle cx="1319" cy="239" r="1.8" fill="#4B3F72"/>
    <text x="1330" y="270" text-anchor="middle" font-size="19" font-weight="700" fill="#17303B">Plataforma IoT</text>
    <text x="1330" y="300" text-anchor="middle" font-size="12.5" fill="#3B4A50">Plataforma_IoT</text>
    <text x="1330" y="326" text-anchor="middle" font-size="12" fill="#5A6B73">Centraliza, procesa y</text>
    <text x="1330" y="344" text-anchor="middle" font-size="12" fill="#5A6B73">almacena las lecturas</text>
  </g>

  <!-- ===================== BLOCK 5: Usuario final ===================== -->
  <g>
    <rect x="1590" y="150" width="260" height="230" rx="14" fill="#FCEEE3" stroke="#C9702E" stroke-width="2"/>
    <!-- icon: dashboard screen -->
    <rect x="1702" y="198" width="36" height="26" rx="3" fill="none" stroke="#C9702E" stroke-width="2.5"/>
    <line x1="1710" y1="206" x2="1710" y2="218" stroke="#C9702E" stroke-width="2.5"/>
    <line x1="1718" y1="210" x2="1718" y2="218" stroke="#C9702E" stroke-width="2.5"/>
    <line x1="1726" y1="203" x2="1726" y2="218" stroke="#C9702E" stroke-width="2.5"/>
    <line x1="1720" y1="230" x2="1720" y2="236" stroke="#C9702E" stroke-width="2.5"/>
    <text x="1720" y="270" text-anchor="middle" font-size="19" font-weight="700" fill="#17303B">Usuario final</text>
    <text x="1720" y="300" text-anchor="middle" font-size="12.5" fill="#3B4A50">Dashboard_Usuario</text>
    <text x="1720" y="326" text-anchor="middle" font-size="12" fill="#5A6B73">Visualiza el estado del</text>
    <text x="1720" y="344" text-anchor="middle" font-size="12" fill="#5A6B73">recurso hídrico en la región</text>
  </g>

  <text x="955" y="430" text-anchor="middle" font-size="12" fill="#8A9AA1">Actividad 2.3 — Conectividad IoT · Reto de monitoreo hídrico Sabana Centro</text>
</svg>
